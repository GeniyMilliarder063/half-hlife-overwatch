<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Half-Life: Overwatch v10</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:monospace;user-select:none;cursor:crosshair}
canvas{display:block;position:absolute;top:0;left:0}
.btn{background:rgba(30,30,40,.9);color:#d4601a;border:2px solid #d4601a;padding:14px 32px;font-family:monospace;font-size:20px;font-weight:bold;cursor:pointer;border-radius:4px;transition:all .15s;letter-spacing:2px;margin:8px 0;min-width:240px;text-align:center}
.btn:hover{background:#d4601a;color:#000;box-shadow:0 0 20px #d4601a}
.btn:active{transform:scale(.96)}
#menu{position:absolute;inset:0;display:flex;background:radial-gradient(circle at 25% 50%,#1a1a2e,#000);z-index:10}
#menuLeft{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;z-index:2}
#menuRight{flex:1;position:relative;overflow:hidden;background:#0a0a1a;z-index:1}
#menu h1{color:#d4601a;font-size:56px;margin-bottom:5px;text-shadow:0 0 30px #d4601a;letter-spacing:6px;text-align:center}
#menu h2{color:#4cf;font-size:22px;margin-bottom:50px;letter-spacing:4px}
#menuCanvas{position:absolute;inset:0;width:100%;height:100%}
#credits{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle,#1a1a2e,#000);z-index:20;color:#fff}
#credits h1{color:#d4601a;font-size:50px;margin-bottom:40px;text-shadow:0 0 30px #d4601a}
#credits .name{font-size:32px;margin:15px 0;color:#4cf;letter-spacing:3px}
#credits .role{font-size:14px;color:#888;margin-bottom:25px}
#pause{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.85);z-index:15}
#pause h1{color:#d4601a;font-size:50px;margin-bottom:40px;text-shadow:0 0 30px #d4601a}
#hint{position:absolute;bottom:20px;left:20px;color:#888;font-size:12px;z-index:5}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="menu">
<div id="menuLeft">
<h1>HALF-LIFE</h1><h2>OVERWATCH</h2>
<button class="btn" onclick="startGame()">▶ ИГРАТЬ</button>
<button class="btn" onclick="showCredits()">👥 АВТОРЫ</button>
</div>
<div id="menuRight"><canvas id="menuCanvas"></canvas></div>
</div>
<div id="credits">
<h1>АВТОРЫ</h1>
<div class="name">geniy_milliarder063</div><div class="role">Идея, дизайн, тестирование</div>
<div class="name">DEEPSEEK</div><div class="role">Разработка, код, графика</div>
<button class="btn" style="margin-top:40px" onclick="hideCredits()">◀ НАЗАД</button>
</div>
<div id="pause">
<h1>ПАУЗА</h1>
<button class="btn" onclick="resumeGame()">▶ ПРОДОЛЖИТЬ</button>
<button class="btn" onclick="showCreditsFromPause()">👥 АВТОРЫ</button>
<button class="btn" onclick="backToMenu()">🏠 В МЕНЮ</button>
</div>
<div id="hint">ESC — пауза</div>
<script>
/* ============================================================
   HALF-LIFE: OVERWATCH v10
   ЧАСТЬ 1/3
   ============================================================ */
const c=document.getElementById('c'),x=c.getContext('2d');
c.width=innerWidth;c.height=innerHeight;
const mc=document.getElementById('menuCanvas'),mx=mc.getContext('2d');
let state='menu';
let demoEnemies=[],demoTime=0;

function resizeMenu(){
  const r=document.getElementById('menuRight').getBoundingClientRect();
  mc.width=r.width;mc.height=r.height;
}
addEventListener('resize',()=>{
  c.width=innerWidth;c.height=innerHeight;
  resizeMenu();
});

/* ============ ЗВУК ============ */
const AC=window.AudioContext||window.webkitAudioContext;
let actx=null;
function initAudio(){
  if(!actx){try{actx=new AC()}catch(e){}}
  if(actx&&actx.state==='suspended')actx.resume();
}
function beep(f,d,t='square',v=.05,s=0){
  if(!actx)return;
  const o=actx.createOscillator(),g=actx.createGain();
  o.type=t;o.frequency.value=f;
  if(s)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+s),actx.currentTime+d);
  g.gain.setValueAtTime(v,actx.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+d);
  o.connect(g);g.connect(actx.destination);
  o.start();o.stop(actx.currentTime+d);
}
function noise(d,v=.08){
  if(!actx)return;
  const b=actx.createBuffer(1,actx.sampleRate*d,actx.sampleRate);
  const dd=b.getChannelData(0);
  for(let i=0;i<dd.length;i++)dd[i]=(Math.random()*2-1)*(1-i/dd.length);
  const s=actx.createBufferSource();s.buffer=b;
  const g=actx.createGain();g.gain.value=v;
  s.connect(g);g.connect(actx.destination);s.start();
}
const SND={
  ar2:()=>{beep(900,.06,'square',.04,-400);beep(1800,.03,'sawtooth',.02)},
  shotgun:()=>{noise(.15,.1);beep(120,.1,'square',.05,-60)},
  smg:()=>beep(700,.04,'square',.03,-300),
  gauss:()=>{beep(300,.25,'sawtooth',.06,1500);beep(1200,.15,'square',.03)},
  gravity:()=>beep(200,.2,'sine',.05,600),
  crossbow:()=>beep(500,.12,'triangle',.05,-200),
  tau:()=>beep(150,.4,'sawtooth',.08,1200),
  flame:()=>noise(.05,.03),
  sniper:()=>{beep(1500,.15,'square',.06,-1200);noise(.1,.05)},
  pain:()=>beep(180,.15,'square',.05,-100),
  pickup:()=>{beep(600,.08,'sine',.05,400);beep(1000,.1,'sine',.04,200)},
  expl:()=>{noise(.4,.12);beep(80,.3,'square',.07,-40)},
  lvl:()=>{beep(500,.1,'sine',.05,200);setTimeout(()=>beep(700,.1,'sine',.05,200),100);setTimeout(()=>beep(1000,.15,'sine',.05,300),200)},
  block:()=>beep(1400,.06,'square',.03,-400),
  ow:()=>{beep(900,.08,'square',.04,-200);beep(700,.1,'square',.03,100)},
  stomp:()=>{beep(150,.15,'square',.06,-80);noise(.1,.08)},
  ant:()=>beep(250,.1,'triangle',.04,150),
  str:()=>beep(80,.6,'sawtooth',.08,-30),
  gren:()=>beep(300,.08,'square',.04),
  mine:()=>beep(700,.06,'sine',.04),
  slash:()=>{beep(2200,.08,'sawtooth',.05,-900);noise(.06,.06)},
  crit:()=>{beep(1800,.1,'square',.07,-900);beep(2400,.08,'sawtooth',.05)},
  combo:()=>{beep(1200,.06,'sine',.05,400);beep(1600,.08,'sine',.04,300)},
  wave:()=>{beep(400,.15,'sine',.06,300);setTimeout(()=>beep(600,.15,'sine',.06,300),150);setTimeout(()=>beep(900,.2,'sine',.06,400),300)}
};

/* ============ МУЗЫКА ============ */
let musicOn=false,musicTimer=0,musicStep=0,musicTempo=400;
function startMusic(){musicOn=true;musicStep=0;musicTempo=400;}
function stopMusic(){musicOn=false;}
function updateMusic(){
  if(!musicOn||!actx)return;
  musicTimer++;
  if(musicTimer>=musicTempo/16){
    musicTimer=0;
    const bassNotes=[55,55,73,55,65,65,82,65];
    beep(bassNotes[musicStep%8],.15,'sawtooth',.04);
    if(musicStep%2===0)beep(8000,.02,'square',.01,-3000);
    if(musicStep%4===0){
      const mel=[220,261,293,349][Math.floor(musicStep/4)%4];
      beep(mel,.2,'triangle',.025);
    }
    musicStep++;
  }
}

/* ============ ИГРОК ============ */
const P={x:0,y:0,vx:0,vy:0,w:28,h:56,hp:100,maxHp:100,armor:0,maxArmor:100,
  onGround:false,jumping:false,crouching:false,speed:4.5,dir:1,invuln:0,
  shieldEnergy:100,shieldActive:false,shieldCooldown:0,stompCooldown:0,
  wounds:[],combo:0,comboTimer:0};

/* ============ ОРУЖИЕ ============ */
const WEAPONS=[
  {name:'AR2',dmg:1,cd:7,spd:15,color:'#ffa040',glow:'#ff8020',auto:true,spread:0,snd:'ar2'},
  {name:'Дробовик',dmg:3,cd:35,spd:13,color:'#ffee88',glow:'#ffcc00',auto:false,spread:.35,pellets:6,snd:'shotgun'},
  {name:'SMG',dmg:1,cd:5,spd:16,color:'#88ffaa',glow:'#44ff88',auto:true,spread:.12,snd:'smg'},
  {name:'Гаусс',dmg:8,cd:55,spd:30,color:'#aaddff',glow:'#44aaff',auto:false,spread:0,pierce:true,snd:'gauss'},
  {name:'Грав-пушка',dmg:0,cd:20,spd:0,color:'#cc88ff',glow:'#8844ff',auto:false,spread:0,gravity:true,snd:'gravity'},
  {name:'Арбалет',dmg:5,cd:45,spd:20,color:'#88cc88',glow:'#44aa44',auto:false,spread:0,pierce:true,snd:'crossbow'},
  {name:'Тау-пушка',dmg:6,cd:60,spd:40,color:'#88ddff',glow:'#00aaff',auto:false,spread:0,pierce:true,snd:'tau'},
  {name:'Огнемёт',dmg:1,cd:3,spd:8,color:'#ff6600',glow:'#ff3300',auto:true,spread:.25,fire:true,snd:'flame'},
  {name:'Снайперка',dmg:12,cd:70,spd:50,color:'#ffffff',glow:'#cccccc',auto:false,spread:0,pierce:true,sniper:true,snd:'sniper'}
];
let currentWeapon=0;

/* ============ МИР ============ */
let bullets=[],enemies=[],blood=[],pickups=[],decals=[],grenades=[],mines=[],barrels=[],crates=[];
let debris=[],shells=[],critTexts=[];
let score=0,kills=0,wave=0,over=false;
let waveKillGoal=50,waveKillCount=0;
let spawnTimer=0,waveBannerTimer=0,wakeUpTimer=0;
let shootCooldown=0,recoil=0,muzzleFlash=0;
let damageFlash=0,screenShake=0;
let keys={};let mouse={x:c.width/2,y:0};
let mouseDown=false;
let dayTime=0;

/* ============ МЕНЮ ============ */
function startGame(){
  initAudio();state='game';
  document.getElementById('menu').style.display='none';
  document.getElementById('pause').style.display='none';
  resetGame();startMusic();
}
function showCredits(){
  state='credits';
  document.getElementById('menu').style.display='none';
  document.getElementById('credits').style.display='flex';
}
function hideCredits(){
  document.getElementById('credits').style.display='none';
  if(state==='creditsFromPause'){
    state='pause';
    document.getElementById('pause').style.display='flex';
  }else{
    state='menu';
    document.getElementById('menu').style.display='flex';
    resizeMenu();
  }
}
function showCreditsFromPause(){
  state='creditsFromPause';
  document.getElementById('pause').style.display='none';
  document.getElementById('credits').style.display='flex';
}
function resumeGame(){state='game';document.getElementById('pause').style.display='none';}
function backToMenu(){
  state='menu';
  document.getElementById('pause').style.display='none';
  document.getElementById('menu').style.display='flex';
  stopMusic();resizeMenu();
}

/* ============ КЛАВИАТУРА / МЫШЬ ============ */
addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(state==='game'){state='pause';document.getElementById('pause').style.display='flex';}
    else if(state==='pause'){resumeGame();}
    else if(state==='credits'||state==='creditsFromPause'){hideCredits();}
    return;
  }
  if(state!=='game')return;
  const k=e.key.toLowerCase();
  keys[k]=true;
  if(k===' '&&!e.repeat)keys['space']=true;
  if(e.code&&e.code.startsWith('Numpad')){
    const n=parseInt(e.code.replace('Numpad',''));
    if(n>=1&&n<=9&&n<=WEAPONS.length){currentWeapon=n-1;beep(800,.04,'square',.03);}
    if(e.code==='NumpadEnter')keys['shield']=true;
    if(e.code==='Numpad0')throwGrenade();
    if(e.code==='NumpadDecimal')placeMine();
  }
  if(k>='1'&&k<='9')currentWeapon=Math.min(WEAPONS.length-1,parseInt(k)-1);
  if(k==='g')throwGrenade();
  if(k==='f')placeMine();
});
addEventListener('keyup',e=>{
  const k=e.key.toLowerCase();keys[k]=false;
  if(k===' ')keys['space']=false;
  if(e.code==='NumpadEnter')keys['shield']=false;
});
addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;P.dir=mouse.x>P.x?1:-1;});
addEventListener('mousedown',e=>{
  if(state!=='game')return;
  initAudio();
  if(e.button===0)mouseDown=true;
  if(e.button===1){e.preventDefault();throwGrenade();}
  if(e.button===2){e.preventDefault();placeMine();}
});
addEventListener('mouseup',e=>{if(e.button===0)mouseDown=false;});
addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('wheel',e=>{
  if(state!=='game')return;
  currentWeapon=(currentWeapon+(e.deltaY>0?1:-1)+WEAPONS.length)%WEAPONS.length;
  beep(800,.03,'square',.03);
},{passive:true});

/* ============ СБРОС ============ */
function resetGame(){
  P.x=c.width/2;P.y=c.height-40-P.h;P.vx=0;P.vy=0;
  P.hp=100;P.armor=0;P.invuln=0;P.shieldEnergy=100;P.shieldActive=false;
  P.shieldCooldown=0;P.stompCooldown=0;P.wounds=[];P.combo=0;P.comboTimer=0;
  bullets=[];enemies=[];blood=[];pickups=[];decals=[];grenades=[];mines=[];
  barrels=[];crates=[];debris=[];shells=[];critTexts=[];
  score=0;kills=0;wave=0;over=false;
  waveKillGoal=50;waveKillCount=0;spawnTimer=0;
  waveBannerTimer=0;wakeUpTimer=0;
  currentWeapon=0;dayTime=0;
  initMap();
  wave=1;waveBannerTimer=300;SND.wave();
}

/* ============ СПАВН ============ */
function spawnEnemy(forceType){
  const r=Math.random();
  let t=forceType;
  if(!t){
    if(r<.20)t='rebel';
    else if(r<.34)t='zombie';
    else if(r<.50)t='crab';
    else if(r<.62)t='veteran';
    else if(r<.74)t='manhack';
    else if(r<.86)t='mancrab';
    else if(r<.94)t='zombine';
    else t='heli';
  }
  const side=Math.random()<.5?-1:1;
  const FLOOR=c.height-40;
  const base={x:side<0?-60:c.width+60,vy:0,vx:0,bob:Math.random()*6.28,dead:false};

  if(t==='heli'){
    enemies.push({...base,y:60+Math.random()*120,vx:side<0?1.2:-1.2,hp:12,type:'heli',shootTimer:60+Math.random()*60,w:140,h:70});
  }else if(t==='strider'){
    enemies.push({...base,y:FLOOR-260,hp:80,maxHp:80,type:'strider',shootTimer:80,w:220,h:220,vx:side<0?1:-1});
  }else if(t==='antlionguard'){
    enemies.push({...base,y:FLOOR-100,hp:20,maxHp:20,type:'antlionguard',w:110,h:80,chargeTimer:120,vx:0});
  }else if(t==='antlion'){
    enemies.push({...base,y:FLOOR-50,speed:2.6,hp:3,type:'antlion',w:60,h:50,jumpTimer:30+Math.random()*60,vx:0});
  }else if(t==='crab'){
    enemies.push({...base,y:FLOOR-40,speed:2,hp:1,type:'crab',w:50,h:40,onGround:true,jumpTimer:20+Math.random()*30});
  }else if(t==='manhack'){
    enemies.push({...base,y:FLOOR-40,speed:2,hp:2,type:'manhack',w:40,h:40});
  }else if(t==='mancrab'){
    enemies.push({...base,y:FLOOR-70,speed:2.5,hp:3,type:'mancrab',w:36,h:40,floatH:FLOOR-70,slashTimer:60,slashFlash:0});
  }else if(t==='zombie'){
    enemies.push({...base,y:FLOOR-50,speed:1,hp:3,type:'zombie',w:40,h:55});
  }else if(t==='zombine'){
    enemies.push({...base,y:FLOOR-54,speed:1.2,hp:4,type:'zombine',w:42,h:60,shootTimer:100});
  }else{
    const v=t==='veteran';
    enemies.push({...base,y:FLOOR-50,speed:v?1.3:1,hp:v?4:2,type:'rebel',veteran:v,shootTimer:90+Math.random()*90,w:40,h:55});
  }
}

/* ============ ГРАНАТЫ / МИНЫ ============ */
function throwGrenade(){
  if(shootCooldown>10)return;
  shootCooldown=30;
  const dx=mouse.x-P.x,dy=mouse.y-(P.y-20);
  const l=Math.hypot(dx,dy)||1;
  grenades.push({x:P.x,y:P.y-20,vx:dx/l*12,vy:dy/l*12-3,life:120});
  SND.gren();
}
function placeMine(){
  if(mines.length>=5)return;
  const dx=mouse.x-P.x,dy=mouse.y-P.y;
  const l=Math.hypot(dx,dy)||1;
  mines.push({x:P.x+dx/l*30,y:P.y+dy/l*30,vx:dx/l*8,vy:dy/l*8-2,life:600,flying:true});
  SND.mine();
}

/* ============ ЧАСТИЦЫ ============ */
function spawnShell(px,py,dir){
  shells.push({x:px,y:py,
    vx:(dir>0?-1:1)*2+(Math.random()-.5)*2,
    vy:-3-Math.random()*2,
    life:90,rot:Math.random()*6.28,vr:(Math.random()-.5)*.5});
}
function spawnFlesh(ex,ey,count){
  for(let i=0;i<count;i++){
    debris.push({x:ex,y:ey,
      vx:(Math.random()-.5)*12,vy:-Math.random()*8-1,
      size:2+Math.random()*4,
      color:Math.random()<.5?'#8a1a1a':'#a02020',
      type:'flesh',life:60+Math.random()*30,
      vr:(Math.random()-.5)*.4,rot:Math.random()*6.28});
  }
}
function spawnMetal(ex,ey,count){
  for(let i=0;i<count;i++){
    debris.push({x:ex,y:ey,
      vx:(Math.random()-.5)*14,vy:-Math.random()*9-1,
      size:2+Math.random()*5,
      color:Math.random()<.5?'#5a5a62':'#3a3a42',
      type:'metal',life:70+Math.random()*40,
      vr:(Math.random()-.5)*.6,rot:Math.random()*6.28});
  }
}
function spawnSparks(ex,ey,count){
  for(let i=0;i<count;i++){
    debris.push({x:ex,y:ey,
      vx:(Math.random()-.5)*16,vy:-Math.random()*10,
      size:1+Math.random()*2,color:'#ffcc44',type:'spark',
      life:25+Math.random()*15,vr:0,rot:0});
  }
}

/* ============ СТРЕЛЬБА ============ */
function shoot(){
  if(shootCooldown>0)return;
  const w=WEAPONS[currentWeapon];
  shootCooldown=w.cd;recoil=w.cd>20?8:4;muzzleFlash=5;
  screenShake=Math.max(screenShake,w.dmg>5?4:2);
  SND[w.snd]();
  if(!w.gravity&&currentWeapon!==7)spawnShell(P.x+w.cd*.5,P.y-20,P.dir);
  if(w.gravity){
    let best=null,bd=1e9;
    for(const b of [...crates,...barrels]){
      if(b.grabbed)continue;
      const d=Math.hypot(b.x-mouse.x,b.y-mouse.y);
      if(d<100&&d<bd){bd=d;best=b;}
    }
    if(best){
      best.grabbed=true;
      const dx=mouse.x-P.x,dy=mouse.y-(P.y-20);
      const l=Math.hypot(dx,dy)||1;
      best.vx=dx/l*18;best.vy=dy/l*18-2;best.thrown=true;
    }
    return;
  }
  const dx=mouse.x-P.x,dy=mouse.y-(P.y-20);
  const ba=Math.atan2(dy,dx),cnt=w.pellets||1;
  for(let i=0;i<cnt;i++){
    const a=ba+(Math.random()-.5)*w.spread;
    bullets.push({x:P.x+Math.cos(a)*25,y:P.y-20+Math.sin(a)*25,
      vx:Math.cos(a)*w.spd,vy:Math.sin(a)*w.spd,life:100,
      damage:w.dmg,color:w.color,glow:w.glow,
      pierce:w.pierce||false,fire:w.fire||false,
      sniper:w.sniper||false,hitIds:[]});
  }
}

function spawnPickup(){
  const med=Math.random()<.6;
  pickups.push({x:100+Math.random()*(c.width-200),
    y:c.height-80-Math.random()*120,type:med?'med':'armor',
    bob:Math.random()*6.28,life:600});
}
function makeCrate(px,py){crates.push({x:px,y:py,w:40,h:40,hp:2,grabbed:false,vx:0,vy:0,thrown:false});}
function makeBarrel(px,py){barrels.push({x:px,y:py,w:32,h:48,hp:1,grabbed:false,vx:0,vy:0,thrown:false});}
function initMap(){
  crates=[];barrels=[];
  const gy=c.height-40;
  for(let i=0;i<6;i++)makeCrate(150+i*220,gy-40);
  for(let i=0;i<4;i++)makeBarrel(300+i*280,gy-48);
}

/* ============ КОЛЛИЗИЯ ============ */
function hitEnemy(b,e){
  const dx=b.x-e.x,dy=b.y-e.y;
  const w=e.w||30,h=e.h||50;
  if(dx<-w/2||dx>w/2)return null;
  if(dy<0||dy>h)return null;
  const rel=dy/h;
  if(rel<0.3)return{zone:'head',mult:2};
  if(rel>0.75)return{zone:'legs',mult:0.5};
  return{zone:'body',mult:1};
}
/* ============================================================
   HALF-LIFE: OVERWATCH v10
   ЧАСТЬ 2/3
   ============================================================ */

/* ============ УБИЙСТВО ============ */
function killEnemy(e){
  e.dead=true;
  kills++;waveKillCount++;
  P.combo++;P.comboTimer=180;
  if(P.combo>0&&P.combo%5===0){
    SND.combo();
    critTexts.push({x:e.x,y:e.y-30,text:'COMBO x'+P.combo,life:60,color:'#ff44ff'});
  }
  const metalTypes=['mancrab','manhack','heli','strider'];
  if(metalTypes.includes(e.type)){
    spawnMetal(e.x,e.y,25);spawnSparks(e.x,e.y,15);
  }else{
    spawnFlesh(e.x,e.y,20);
  }
  let s=20;
  if(e.type==='crab')s=10;
  else if(e.type==='manhack')s=15;
  else if(e.type==='mancrab')s=50;
  else if(e.type==='zombie')s=25;
  else if(e.type==='zombine')s=45;
  else if(e.type==='antlion')s=30;
  else if(e.type==='antlionguard')s=300;
  else if(e.type==='heli')s=200;
  else if(e.type==='strider')s=1000;
  else if(e.veteran)s=40;
  score+=s*(1+Math.floor(P.combo/5));
  if(Math.random()<.15)spawnPickup();
  for(let k=0;k<3;k++)decals.push({
    x:e.x+(Math.random()-.5)*40,y:e.y,
    size:20+Math.random()*15,rot:Math.random()*6.28,
    alpha:.9,age:0,life:1500
  });
}

/* ============ ОБНОВЛЕНИЕ ============ */
function update(){
  if(state!=='game')return;
  if(over)return;
  const FLOOR=c.height-40;
  const groundY=FLOOR-P.h;

  dayTime=(dayTime+0.00015)%1;
  if(P.comboTimer>0){P.comboTimer--;if(P.comboTimer===0)P.combo=0;}

  // прыжок
  if((keys['w']||keys['arrowup']||keys['space'])&&P.onGround&&!P.jumping){
    P.vy=-13;P.onGround=false;P.jumping=true;
    beep(500,.08,'sine',.04,300);
    setTimeout(()=>P.jumping=false,200);
  }
  const sliding=keys['space']&&!P.onGround&&P.vy>0;
  P.vy+=sliding?.15:.55;
  if(sliding)P.vy=Math.min(P.vy,3);
  P.y+=P.vy;
  if(P.y>=groundY){P.y=groundY;P.vy=0;P.onGround=true;}else P.onGround=false;
  P.crouching=!!keys['s']&&P.onGround;

  if(keys['a']||keys['arrowleft'])P.x-=P.speed;
  if(keys['d']||keys['arrowright'])P.x+=P.speed;
  P.x=Math.max(35,Math.min(c.width-35,P.x));

  // щит
  const wantShield=keys['shield']||keys['shift'];
  if(wantShield&&P.shieldEnergy>0&&P.shieldCooldown<=0){
    P.shieldActive=true;P.shieldEnergy-=.35;
    if(P.shieldEnergy<=0){P.shieldEnergy=0;P.shieldActive=false;P.shieldCooldown=120;}
  }else{
    if(P.shieldActive)P.shieldActive=false;
    if(P.shieldEnergy<100)P.shieldEnergy+=.35;
    if(P.shieldCooldown>0)P.shieldCooldown--;
  }

  // стрельба
  const w=WEAPONS[currentWeapon];
  if(mouseDown){
    if(w.auto)shoot();
    else if(shootCooldown<=0)shoot();
  }
  if(shootCooldown>0)shootCooldown--;
  if(recoil>0)recoil-=.8;
  if(damageFlash>0)damageFlash--;
  if(screenShake>0)screenShake*=.9;

  // пули игрока
  bullets.forEach((b,i)=>{
    b.x+=b.vx;b.y+=b.vy;b.life--;
    if(b.life<=0||b.x<0||b.x>c.width||b.y<0||b.y>c.height)bullets.splice(i,1);
  });

  // гранаты
  grenades.forEach((g,i)=>{
    g.vy+=.4;g.x+=g.vx;g.y+=g.vy;g.life--;
    if(g.y>FLOOR){g.y=FLOOR;g.vy*=-.5;g.vx*=.7;}
    if(g.life<=0){
      SND.expl();screenShake=15;
      for(let k=0;k<40;k++)blood.push({x:g.x,y:g.y,vx:(Math.random()-.5)*14,vy:(Math.random()-.5)*14,life:40,orange:true});
      for(let k=0;k<6;k++)decals.push({x:g.x+(Math.random()-.5)*60,y:g.y+(Math.random()-.5)*60,size:20+Math.random()*20,rot:Math.random()*6.28,alpha:.9,age:0,life:1500});
      enemies.forEach(e=>{if(!e.dead&&Math.hypot(e.x-g.x,e.y-g.y)<120)e.hp-=5;});
      grenades.splice(i,1);
    }
  });

  // мины
  mines.forEach((m,i)=>{
    if(m.flying){
      m.vy+=.5;m.x+=m.vx;m.y+=m.vy;
      if(m.y>FLOOR){m.y=FLOOR;m.vy=0;m.vx=0;m.flying=false;}
      if(m.x<20||m.x>c.width-20)m.vx*=-.5;
    }
    m.life--;
    if(m.life<=0){mines.splice(i,1);return;}
    for(const e of enemies){
      if(e.dead)continue;
      const dx=Math.abs(e.x-m.x);
      const dy=Math.abs((e.y+e.h/2)-(m.y-10));
      if(dx<50&&dy<100){
        SND.expl();screenShake=10;
        for(let k=0;k<25;k++)blood.push({x:m.x,y:m.y,vx:(Math.random()-.5)*12,vy:(Math.random()-.5)*12,life:35,orange:true});
        decals.push({x:m.x,y:m.y,size:25,rot:Math.random()*6.28,alpha:.9,age:0,life:1500});
        e.hp-=4;mines.splice(i,1);break;
      }
    }
  });

  // пули врагов
  bullets.forEach((b,i)=>{
    if(!b.enemy)return;
    if(P.shieldActive){
      const d=Math.hypot(b.x-P.x,b.y-(P.y-10+P.h/2));
      if(d<42){
        SND.block();
        for(let k=0;k<4;k++)blood.push({x:b.x,y:b.y,vx:(Math.random()-.5)*4,vy:(Math.random()-.5)*4,life:15,cyan:true});
        bullets.splice(i,1);return;
      }
    }
    if(P.invuln<=0&&Math.hypot(b.x-P.x,b.y-(P.y-15))<26){
      let d=b.big?12:6;
      if(P.armor>0){const a=Math.min(P.armor,d*.5);P.armor-=a;d-=a;}
      P.hp-=d;P.invuln=20;damageFlash=8;screenShake=6;SND.pain();
      P.combo=0;P.comboTimer=0;
      P.wounds.push({x:b.x-P.x+(Math.random()-.5)*8,y:b.y-P.y-10+(Math.random()-.5)*8,type:d>10?'big':'small',age:0,life:1200});
      if(P.wounds.length>8)P.wounds.shift();
      for(let k=0;k<8;k++)blood.push({x:P.x+(Math.random()-.5)*20,y:P.y-15+(Math.random()-.5)*20,vx:(Math.random()-.5)*6,vy:(Math.random()-.5)*6,life:20,blue:true});
      bullets.splice(i,1);
      if(P.hp<=0){P.hp=0;over=true;}
    }
  });

  /* ===== ИИ ВРАГОВ (forEach — return) ===== */
  enemies.forEach(e=>{
    if(e.dead)return;
    if(e.type==='heli'){
      e.x+=e.vx;
      if(e.x<P.x-120)e.vx=Math.min(e.vx+.05,2);
      else if(e.x>P.x+120)e.vx=Math.max(e.vx-.05,-2);
      e.y+=Math.sin(e.bob)*.8;e.bob+=.05;
      e.shootTimer--;
      if(e.shootTimer<=0){
        SND.ow();
        const dx=P.x-e.x,dy=(P.y-15)-e.y;
        const l=Math.hypot(dx,dy)||1;
        for(let i=0;i<3;i++)bullets.push({x:e.x+15,y:e.y+20,vx:dx/l*6+(Math.random()-.5)*1.5,vy:dy/l*6+(Math.random()-.5)*1.5,life:200,enemy:true,big:true,color:'#ff8040',glow:'#ff4020'});
        e.shootTimer=60+Math.random()*40;
      }
      return;
    }
    if(e.type==='strider'){
      e.x+=e.vx;
      if(e.x<80)e.vx=Math.abs(e.vx);
      if(e.x>c.width-80)e.vx=-Math.abs(e.vx);
      e.shootTimer--;
      if(e.shootTimer<=0){
        SND.str();
        const dx=P.x-e.x,dy=(P.y-15)-(e.y+30);
        const l=Math.hypot(dx,dy)||1;
        bullets.push({x:e.x,y:e.y+30,vx:dx/l*7,vy:dy/l*7,life:300,enemy:true,big:true,color:'#ff8040',glow:'#ff4020'});
        e.shootTimer=70;
      }
      return;
    }
    if(e.type==='antlionguard'){
      e.chargeTimer=(e.chargeTimer||120)-1;
      const dx=P.x-e.x;
      if(e.chargeTimer<=0){e.vx=Math.sign(dx)*4;e.chargeTimer=90;}
      else if(e.chargeTimer>60)e.vx*=.95;
      e.x+=e.vx;
      if(Math.hypot(P.x-e.x,P.y-e.y)<60&&P.invuln<=0&&!P.shieldActive){
        let d=20;
        if(P.armor>0){const a=Math.min(P.armor,d*.5);P.armor-=a;d-=a;}
        P.hp-=d;P.invuln=40;damageFlash=12;screenShake=15;SND.pain();
        P.combo=0;P.comboTimer=0;
        P.wounds.push({x:(Math.random()-.5)*10,y:-10+(Math.random()-.5)*10,type:'big',age:0,life:1200});
        if(P.hp<=0){P.hp=0;over=true;}
      }
      return;
    }
    if(e.type==='antlion'){
      e.jumpTimer=(e.jumpTimer||60)-1;
      if(e.jumpTimer<=0&&P.onGround){
        const dx=P.x-e.x;
        e.vx=Math.sign(dx)*3;e.vy=-8;
        e.jumpTimer=60+Math.random()*60;SND.ant();
      }
      e.x+=e.vx;e.vy+=.5;e.y+=e.vy;
      const gy=FLOOR-e.h;
      if(e.y>gy){e.y=gy;e.vy=0;}
      if(Math.hypot(P.x-e.x,P.y-e.y)<40&&P.invuln<=0&&!P.shieldActive){
        let d=12;
        if(P.armor>0){const a=Math.min(P.armor,d*.5);P.armor-=a;d-=a;}
        P.hp-=d;P.invuln=30;damageFlash=8;SND.pain();
        P.combo=0;P.comboTimer=0;
        P.wounds.push({x:(Math.random()-.5)*15,y:(Math.random()-.5)*15,type:'small',age:0,life:1200});
        if(P.hp<=0){P.hp=0;over=true;}
      }
      return;
    }
    if(e.type==='crab'){
      const dx=P.x-e.x,dy=P.y-e.y,dist=Math.hypot(dx,dy);
      const gy=FLOOR-e.h;
      if(e.onGround){
        e.y=gy;e.jumpTimer--;
        if(e.jumpTimer<=0){
          const angle=Math.atan2(dy,dx);
          e.vx=Math.cos(angle)*3.5;e.vy=-7;
          e.onGround=false;e.jumpTimer=30+Math.random()*30;SND.ant();
        }else e.x+=Math.sign(dx)*.8;
      }else{
        e.vy+=.5;e.x+=e.vx;e.y+=e.vy;
        if(e.y>=gy){e.y=gy;e.vy=0;e.onGround=true;}
      }
      if(dist<30&&P.invuln<=0&&!P.shieldActive){
        let d=8;
        if(P.armor>0){const a=Math.min(P.armor,d*.5);P.armor-=a;d-=a;}
        P.hp-=d;P.invuln=25;damageFlash=8;SND.pain();
        P.combo=0;P.comboTimer=0;
        P.wounds.push({x:(Math.random()-.5)*10,y:(Math.random()-.5)*10,type:'small',age:0,life:1200});
        if(P.hp<=0){P.hp=0;over=true;}
      }
      return;
    }
    if(e.type==='manhack'){
      const dx=P.x-e.x,dy=P.y-e.y,gy=FLOOR-e.h;
      e.y=gy;e.x+=Math.sign(dx)*e.speed;
      if(Math.hypot(dx,dy)<36&&P.invuln<=0&&!P.shieldActive){
        let d=10;
        if(P.armor>0){const a=Math.min(P.armor,d*.5);P.armor-=a;d-=a;}
        P.hp-=d;P.invuln=25;damageFlash=8;SND.pain();
        P.combo=0;P.comboTimer=0;
        P.wounds.push({x:(Math.random()-.5)*10,y:(Math.random()-.5)*10,type:'small',age:0,life:1200});
        if(P.hp<=0){P.hp=0;over=true;}
      }
      return;
    }
    if(e.type==='mancrab'){
      const dx=P.x-e.x,dy=(P.y-20)-e.y;
      const l=Math.hypot(dx,dy)||1;
      if(l>40){
        e.x+=dx/l*e.speed;
        e.y+=dy/l*e.speed;
      }else if(e.slashTimer>0){
        e.slashTimer--;
      }else{
        e.slashTimer=45;e.slashFlash=15;
        SND.slash();
        let d=15;
        if(P.armor>0){const a=Math.min(P.armor,d*.5);P.armor-=a;d-=a;}
        P.hp-=d;P.invuln=20;damageFlash=10;screenShake=8;SND.pain();
        P.combo=0;P.comboTimer=0;
        P.wounds.push({x:(Math.random()-.5)*15,y:(Math.random()-.5)*15,type:'big',age:0,life:1200});
        if(P.hp<=0){P.hp=0;over=true;}
      }
      e.bob+=.15;
      if(l>200)e.y+=(e.floatH-e.y)*.05;
      if(e.slashFlash>0)e.slashFlash--;
      return;
    }
    if(e.type==='zombie'){
      const dx=P.x-e.x,dy=P.y-e.y,gy=FLOOR-e.h;
      e.y+=(gy-e.y)*.3;e.x+=Math.sign(dx)*e.speed;
      if(Math.hypot(dx,dy)<35&&P.invuln<=0&&!P.shieldActive){
        let d=15;
        if(P.armor>0){const a=Math.min(P.armor,d*.5);P.armor-=a;d-=a;}
        P.hp-=d;P.invuln=30;damageFlash=8;SND.pain();
        P.combo=0;P.comboTimer=0;
        P.wounds.push({x:(Math.random()-.5)*15,y:(Math.random()-.5)*15,type:'big',age:0,life:1200});
        if(P.hp<=0){P.hp=0;over=true;}
      }
      return;
    }
    if(e.type==='zombine'){
      const dx=P.x-e.x,dy=P.y-e.y,gy=FLOOR-e.h;
      e.y+=(gy-e.y)*.3;e.x+=Math.sign(dx)*e.speed;
      e.shootTimer--;
      if(e.shootTimer<=0&&Math.abs(dx)<500){
        SND.ow();
        const l=Math.hypot(dx,dy)||1;
        for(let i=0;i<3;i++)bullets.push({x:e.x,y:e.y+10,vx:dx/l*7+(Math.random()-.5)*1.2,vy:dy/l*7+(Math.random()-.5)*1.2,life:120,enemy:true,color:'#ffdd44',glow:'#ff8020'});
        e.shootTimer=130;
      }
      if(Math.hypot(dx,dy)<40&&P.invuln<=0&&!P.shieldActive){
        let d=14;
        if(P.armor>0){const a=Math.min(P.armor,d*.5);P.armor-=a;d-=a;}
        P.hp-=d;P.invuln=30;damageFlash=8;SND.pain();
        P.combo=0;P.comboTimer=0;
        P.wounds.push({x:(Math.random()-.5)*15,y:(Math.random()-.5)*15,type:'big',age:0,life:1200});
        if(P.hp<=0){P.hp=0;over=true;}
      }
      return;
    }
    // повстанец
    const dx=P.x-e.x,dy=P.y-e.y,dist=Math.hypot(dx,dy),dir=Math.sign(dx);
    const gy=FLOOR-e.h;
    e.y+=(gy-e.y)*.3;
    if(Math.abs(dx)>150)e.x+=dir*e.speed;
    else if(Math.abs(dx)<80)e.x-=dir*e.speed*.6;
    e.shootTimer--;
    if(e.shootTimer<=0&&Math.abs(dx)<500){
      SND.smg();
      const l=Math.hypot(dx,dy)||1;
      for(let i=0;i<3;i++)bullets.push({x:e.x,y:e.y+10,vx:dx/l*7+(Math.random()-.5)*1.2,vy:dy/l*7+(Math.random()-.5)*1.2,life:120,enemy:true,color:'#ffdd44',glow:'#ff8020'});
      e.shootTimer=110+Math.random()*70;
    }
    if(dist<40&&P.invuln<=0&&!P.shieldActive){
      let d=10;
      if(P.armor>0){const a=Math.min(P.armor,d*.5);P.armor-=a;d-=a;}
      P.hp-=d;P.invuln=30;damageFlash=8;SND.pain();
      P.combo=0;P.comboTimer=0;
      P.wounds.push({x:(Math.random()-.5)*15,y:(Math.random()-.5)*15,type:'small',age:0,life:1200});
      if(P.hp<=0){P.hp=0;over=true;}
    }
  });

  // атака сверху (for — continue)
  if(!P.onGround&&P.vy>0&&P.stompCooldown<=0){
    for(let ei=enemies.length-1;ei>=0;ei--){
      const e=enemies[ei];
      if(e.dead)continue;
      const ex=e.x,ey=e.y;
      const overlap=Math.abs(P.x-ex)<(e.w||30)/2+16&&P.y+P.h>ey-10&&P.y<ey+e.h+10;
      if(overlap&&P.vy>3){
        let dmg;
        if(e.type==='crab'||e.type==='manhack'||e.type==='mancrab')dmg=999;
        else if(e.type==='antlionguard')dmg=4;
        else if(e.type==='strider'||e.type==='heli')dmg=0;
        else dmg=Math.ceil(e.hp/2);
        if(dmg>0){
          e.hp-=dmg;
          SND.stomp();screenShake=8;
          for(let k=0;k<15;k++)blood.push({x:ex,y:ey,vx:(Math.random()-.5)*10,vy:(Math.random()-.5)*10,life:30});
          decals.push({x:ex,y:ey,size:15,rot:Math.random()*6.28,alpha:.9,age:0,life:1500});
          if(e.hp<=0)killEnemy(e);
        }
        P.vy=-8;P.stompCooldown=20;
        break;
      }
    }
  }
  if(P.stompCooldown>0)P.stompCooldown--;

  // попадания пуль (for — continue)
  for(let ei=enemies.length-1;ei>=0;ei--){
    const e=enemies[ei];
    if(e.dead)continue;
    for(let bi=bullets.length-1;bi>=0;bi--){
      const b=bullets[bi];
      if(b.enemy)continue;
      if(b.hitIds&&b.hitIds.includes(e))continue;
      const hit=hitEnemy(b,e);
      if(hit){
        let dmg=b.damage*hit.mult;
        if(Math.random()<.1){
          dmg*=3;SND.crit();
          critTexts.push({x:e.x,y:e.y-10,text:'КРИТ! '+Math.round(dmg),life:50,color:'#ffcc00'});
          for(let k=0;k<8;k++)debris.push({x:b.x,y:b.y,vx:(Math.random()-.5)*10,vy:-Math.random()*8,size:2+Math.random()*2,color:'#ffcc44',type:'spark',life:30,vr:0,rot:0});
        }
        if(b.pierce){
          if(!b.hitIds)b.hitIds=[];
          b.hitIds.push(e);e.hp-=dmg;
        }else{
          e.hp-=dmg;bullets.splice(bi,1);
        }
        if(b.fire&&!e.burning)e.burning=120;
        const pcol=hit.zone==='head'?'#ffff44':hit.zone==='legs'?'#ff8800':'#ff2020';
        for(let k=0;k<3;k++)blood.push({x:b.x,y:b.y,vx:(Math.random()-.5)*5,vy:(Math.random()-.5)*5,life:15,zone:pcol});
        if(Math.random()<.3)decals.push({x:e.x+(Math.random()-.5)*30,y:e.y+(hit.zone==='head'?0:hit.zone==='legs'?e.h:30),size:10+Math.random()*10,rot:Math.random()*6.28,alpha:.8,age:0,life:1500});
        for(let k=0;k<4;k++)blood.push({x:e.x+(Math.random()-.5)*10,y:e.y+(hit.zone==='head'?5:hit.zone==='legs'?e.h-5:e.h/2),vx:(Math.random()-.5)*7,vy:(Math.random()-.5)*7,life:22});
        if(e.hp<=0)killEnemy(e);
        if(!b.pierce)break;
      }
    }
    if(!e.dead&&e.burning){
      e.burning--;e.hp-=.05;
      if(Math.random()<.3)blood.push({x:e.x+(Math.random()-.5)*20,y:e.y,vx:(Math.random()-.5)*2,vy:-1,life:20,orange:true});
      if(e.hp<=0)killEnemy(e);
    }
  }

  // удаление мёртвых
  enemies=enemies.filter(e=>!e.dead);

  // пикапы
  pickups.forEach((p,i)=>{
    p.bob+=.1;p.life--;
    if(p.life<=0){pickups.splice(i,1);return;}
    const dx=P.x-p.x,dy=(P.y-10)-p.y;
    const d=Math.hypot(dx,dy);
    if(d<180){p.x+=dx/d*2.5;p.y+=dy/d*2.5;}
    if(d<35){
      if(p.type==='med')P.hp=Math.min(P.maxHp,P.hp+25);
      else P.armor=Math.min(P.maxArmor,P.armor+40);
      SND.pickup();
      for(let k=0;k<10;k++)blood.push({x:p.x,y:p.y,vx:(Math.random()-.5)*5,vy:(Math.random()-.5)*5,life:20,green:true});
      pickups.splice(i,1);
    }
  });

  // ящики/бочки (forEach — return)
  [...crates,...barrels].forEach(obj=>{
    if(obj.grabbed&&obj.thrown){
      obj.x+=obj.vx;obj.y+=obj.vy;obj.vy+=.5;
      if(obj.y>FLOOR-obj.h){obj.y=FLOOR-obj.h;obj.vy=0;obj.vx*=.8;obj.thrown=false;obj.grabbed=false;}
      enemies.forEach(e=>{
        if(e.dead)return;
        if(Math.hypot(e.x-obj.x,e.y-obj.y)<50){
          e.hp-=3;obj.thrown=false;obj.grabbed=false;
          SND.expl();spawnMetal(obj.x,obj.y,15);
          for(let k=0;k<10;k++)blood.push({x:e.x,y:e.y,vx:(Math.random()-.5)*8,vy:(Math.random()-.5)*8,life:25});
        }
      });
    }else{
      obj.vy+=.5;obj.y+=obj.vy;
      if(obj.y>FLOOR-obj.h){obj.y=FLOOR-obj.h;obj.vy=0;}
    }
  });

  blood.forEach((p,i)=>{
    p.x+=p.vx;p.y+=p.vy;p.vy+=.3;p.vx*=.98;p.life--;
    if(p.life<=0)blood.splice(i,1);
  });
  debris.forEach((d,i)=>{
    d.x+=d.vx;d.y+=d.vy;d.vy+=.5;d.vx*=.98;d.rot+=d.vr;d.life--;
    if(d.y>FLOOR&&d.vy>0){d.y=FLOOR;d.vy*=-.4;d.vx*=.6;if(Math.abs(d.vy)<1){d.vy=0;d.vx*=.5;}}
    if(d.life<=0)debris.splice(i,1);
  });
  shells.forEach((s,i)=>{
    s.x+=s.vx;s.y+=s.vy;s.vy+=.5;s.vx*=.97;s.rot+=s.vr;s.life--;
    if(s.y>FLOOR){s.y=FLOOR;s.vy*=-.3;s.vx*=.5;}
    if(s.life<=0)shells.splice(i,1);
  });
  critTexts.forEach((t,i)=>{t.y-=.5;t.life--;if(t.life<=0)critTexts.splice(i,1);});
  P.wounds.forEach(w=>{w.age++;});
  P.wounds=P.wounds.filter(w=>w.age<w.life);
  decals.forEach(d=>{d.age++;});
  decals=decals.filter(d=>d.age<d.life);

  // волны
  if(waveBannerTimer>0)waveBannerTimer--;
  if(waveKillCount>=waveKillGoal){
    wave++;waveKillCount=0;waveKillGoal=50+(wave-1)*10;
    waveBannerTimer=300;SND.wave();
    musicTempo=Math.max(200,400-wave*10);
    if(wave===5)spawnEnemy('antlionguard');
    else if(wave===10)spawnEnemy('strider');
    else if(wave===15)spawnEnemy('antlionguard');
    else if(wave===20)spawnEnemy('strider');
    else if(wave>=25){
      if(wave%10===0)spawnEnemy('strider');
      else if(wave%5===0)spawnEnemy('antlionguard');
    }
    if(wave%3===0)spawnEnemy('heli');
    if(Math.random()<.2)wakeUpTimer=180;
  }else{
    spawnTimer++;
    const maxOnField=3+Math.floor(wave/2);
    if(spawnTimer%40===0&&enemies.length<maxOnField)spawnEnemy();
  }
  if(wakeUpTimer>0)wakeUpTimer--;
  if(P.invuln>0)P.invuln--;
  updateMusic();
}

/* ============ НЕБО ============ */
function getSkyColors(){
  const t=dayTime;
  if(t<0.15)return['#3a3a4a','#b8b4a8','#8a867a'];
  if(t<0.30)return['#3a2a4a','#c88a5a','#5a4a3a'];
  if(t<0.45)return['#0a0a1e','#1a1a3a','#0a0a1a'];
  if(t<0.60)return['#2a1a3a','#5a4a5a','#3a3a4a'];
  if(t<0.75)return['#3a3a4a','#b8b4a8','#8a867a'];

  return['#0a0a1e','#1a1a3a','#0a0a1a'];
}

  x.beginPath();x.arc(cx-7,cy-28,3,0,Math.PI*2);x.fill();
  x.beginPath();x.arc(cx+7,cy-28,3,0,Math.PI*2);x.fill();
  const hpW=140;
  x.fillStyle='rgba(0,0,0,.7)';x.fillRect(cx-hpW/2,cy-80,hpW,10);
  x.fillStyle='#c33';x.fillRect(cx-hpW/2,cy-80,hpW*(e.hp/e.maxHp||1),10);
  x.strokeStyle='#000';x.lineWidth=1;x.strokeRect(cx-hpW/2,cy-80,hpW,10);
}

/* ============ ФОН ============ */
function drawBG(){
  const[top,mid,bot]=getSkyColors();
  const g=x.createLinearGradient(0,0,0,c.height);
  g.addColorStop(0,top);g.addColorStop(.5,mid);g.addColorStop(1,bot);
  x.fillStyle=g;x.fillRect(0,0,c.width,c.height);
  const hy=c.height*.35;
  x.strokeStyle='rgba(80,70,60,.35)';x.lineWidth=1;
  for(let i=0;i<c.width;i+=60){x.beginPath();x.moveTo(i,0);x.lineTo(i,c.height-40);x.stroke();}
  for(let j=hy;j<c.height-40;j+=40){
    const s=(j-hy)/(c.height-40-hy);
    x.globalAlpha=.3+s*.5;
    x.beginPath();x.moveTo(0,j);x.lineTo(c.width,j);x.stroke();
  }
  x.globalAlpha=1;
  x.save();x.globalAlpha=.15;x.fillStyle='#8a7a20';
  x.font='bold 220px serif';x.textAlign='center';
  x.fillText('λ',c.width/2,c.height/2+60);x.restore();
  const night=(dayTime>0.35&&dayTime<0.55)||dayTime>0.9;
  if(night){x.fillStyle='rgba(0,0,30,.35)';x.fillRect(0,0,c.width,c.height);}
  const fy=c.height-40;
  const fg=x.createLinearGradient(0,fy,0,c.height);
  fg.addColorStop(0,'#3a3428');fg.addColorStop(1,'#1a1810');
  x.fillStyle=fg;x.fillRect(0,fy,c.width,40);
}
/* ============================================================
   HALF-LIFE: OVERWATCH v10
   ЧАСТЬ 3/3 — draw() и запуск
   ============================================================ */

function draw(){
  x.save();
  if(screenShake>0)x.translate((Math.random()-.5)*screenShake,(Math.random()-.5)*screenShake);
  drawBG();

  // декали
  decals.forEach(d=>{
    const a=d.alpha*(1-d.age/d.life);
    x.globalAlpha=a;x.fillStyle='#6a0808';
    x.save();x.translate(d.x,d.y);x.rotate(d.rot);
    x.beginPath();x.arc(0,0,d.size,0,Math.PI*2);x.fill();x.restore();
    x.globalAlpha=1;
  });

  // ящики
  crates.forEach(cr=>{
    x.fillStyle='#6a4a1a';x.fillRect(cr.x,cr.y-4,cr.w,4);
    x.fillStyle='#8a6a3a';x.fillRect(cr.x,cr.y,cr.w,cr.h);
    x.strokeStyle='#5a3a1a';x.lineWidth=2;x.strokeRect(cr.x,cr.y,cr.w,cr.h);
    x.beginPath();x.moveTo(cr.x,cr.y);x.lineTo(cr.x+cr.w,cr.y+cr.h);
    x.moveTo(cr.x+cr.w,cr.y);x.lineTo(cr.x,cr.y+cr.h);x.stroke();
  });

  // бочки
  barrels.forEach(b=>{
    x.fillStyle='#6a1010';x.fillRect(b.x,b.y,b.w,4);
    x.fillStyle='#a02020';x.fillRect(b.x,b.y,b.w,b.h);
    x.fillStyle='#801010';

  // гранаты

  });

  // пикапы
  pickups.forEach(p=>{
    const bob=Math.sin(p.bob)*3,py=p.y+bob;

    if(p.type==='med'){

      x.fillStyle='#e22';x.fillRect(p.x-2,py-8,4,16);x.fillRect(p.x-8,py-2,16,4);
    }else{
      x.fillStyle='#4af';x.fillRect(p.x-12,py-12,24,24);
      x.fillStyle='#fff';x.fillRect(p.x-8,py-8,16,16);
      x.fillStyle='#4af';
      x.beginPath();x.moveTo(p.x,py-6);x.lineTo(p.x+6,py);x.lineTo(p.x,py+6);x.lineTo(p.x-6,py);x.fill();
    }
    x.shadowBlur=0;
  });

  // частицы крови
  blood.forEach(p=>{
    if(p.zone)x.fillStyle=p.zone;
    else if(p.orange)x.fillStyle='rgba(255,'+(120+Math.random()*80|0)+',20,'+(p.life/40)+')';
    else if(p.blue)x.fillStyle='rgba(80,180,255,'+(p.life/20)+')';

  });

  // обломки (плоть/железо/искры)
  debris.forEach(d=>{
    const a=Math.min(1,d.life/20);
    x.globalAlpha=a;
    x.save();x.translate(d.x,d.y);x.rotate(d.rot);
    if(d.type==='spark'){
      x.shadowColor='#ffcc44';x.shadowBlur=8;
      x.fillStyle='#fff';
      x.fillRect(-d.size/2,-d.size/2,d.size,d.size);
      x.shadowBlur=0;
    }else if(d.type==='flesh'){
      x.fillStyle=d.color;
      x.fillRect(-d.size/2,-d.size/2,d.size,d.size*.7);
      x.fillStyle='#5a0808';
      x.fillRect(-d.size/4,-d.size/4,d.size/2,d.size/4);
    }else{
      x.fillStyle=d.color;
      x.fillRect(-d.size/2,-d.size/2,d.size,d.size);
      x.fillStyle='#1a1a1e';
      x.fillRect(-d.size/2,-d.size/2,d.size/4,d.size/4);
    }
    x.restore();
    x.globalAlpha=1;
  });

  // гильзы
  shells.forEach(s=>{
    x.save();x.translate(s.x,s.y);x.rotate(s.rot);
    x.fillStyle='#c8a020';x.fillRect(-3,-1,6,2);
    x.fillStyle='#8a6a10';x.fillRect(-3,-1,2,2);
    x.restore();
  });

  // враги
  enemies.forEach(e=>{
    if(e.dead)return;
    if(e.type==='crab')drawCrabBody(e.x,e.y+15,.9,'#d8c8a8');
    else if(e.type==='mancrab')drawMancrab(e);
    else if(e.type==='manhack')drawManhack(e);

    else if(e.type==='zombine')drawZombine(e);

    else if(e.type==='strider')drawStrider(e);

    else drawRebel(e);
  });

  // пули
  bullets.forEach(b=>{
    x.shadowColor=b.glow;x.shadowBlur=10;
    x.fillStyle=b.color;
    x.beginPath();x.arc(b.x,b.y,b.big?5:4,0,Math.PI*2);x.fill();
    x.fillStyle='#fff';
    x.beginPath();x.arc(b.x,b.y,1.5,0,Math.PI*2);x.fill();
    x.shadowBlur=0;
  });

  // игрок
  drawPlayer();

  // всплывающий текст критов/комбо
  critTexts.forEach(t=>{

    x.fillStyle=t.color;
    x.font='bold 18px monospace';
    x.textAlign='center';
    x.strokeStyle='#000';x.lineWidth=3;

    x.fillText(t.text,t.x,t.y);
    x.textAlign='left';
    x.globalAlpha=1;
  });

  x.restore();

  /* ============ HUD ============ */

  x.strokeStyle='#d4601a';x.lineWidth=2;x.strokeRect(10,10,360,180);
  x.fillStyle='#d4601a';x.font='bold 15px monospace';
  x.fillText('OVERWATCH',20,30);

  // HP
  x.fillStyle='#4cf';x.font='bold 13px monospace';x.fillText('HP',20,52);

  x.fillStyle='#4cf';x.fillRect(55,40,290*(P.hp/P.maxHp),16);
  x.strokeStyle='#08a';x.strokeRect(55,40,290,16);
  x.fillStyle='#fff';x.fillText(Math.ceil(P.hp)+'%',180,52);

  // ARM
  x.fillStyle='#fc4';x.fillText('ARM',20,74);
  x.fillStyle='#330';x.fillRect(55,62,290,16);
  x.fillStyle='#fc4';x.fillRect(55,62,290*(P.armor/P.maxArmor),16);
  x.strokeStyle='#a80';x.strokeRect(55,62,290,16);
  x.fillStyle='#fff';x.fillText(Math.ceil(P.armor)+'%',180,74);

  // SHLD
  x.fillStyle='#4cf';x.fillText('SHLD',20,96);
  x.fillStyle='#033';x.fillRect(55,84,290,16);
  if(P.shieldCooldown>0){
    x.fillStyle='#f44';x.fillRect(55,84,290,16);
    x.fillStyle='#fff';x.fillText('ПЕРЕЗАРЯДКА',150,96);
  }else{
    x.fillStyle='#4cf';x.fillRect(55,84,290*(P.shieldEnergy/100),16);
    x.fillStyle='#fff';x.fillText(Math.ceil(P.shieldEnergy)+'%',180,96);
  }

  // счёт

  x.fillText('Очки: '+score+'   Волна: '+wave+'   Цель: '+waveKillCount+'/'+waveKillGoal,20,120);

  // комбо
  if(P.combo>0){

  }else{
    x.fillStyle='#aaa';x.font='bold 11px monospace';
    x.fillText('WASD-движ  W/Space-прыжок  S-присед  Space-замедл.пад.',20,140);
  }
  x.fillStyle='#aaa';x.font='bold 11px monospace';
  x.fillText('ЛКМ-огонь  NumEnter/Shift-щит  СКМ-граната  ПКМ-мина',20,155);
  x.fillText('Num 1-9 / 1-9 / КОЛЕСО-смена оружия   ESC-пауза',20,170);

  // список оружия
  x.font='bold 12px monospace';
  for(let i=0;i<WEAPONS.length;i++){
    const wy=200+i*22;
    x.fillStyle=i===currentWeapon?'#ffa040':'#888';
    if(i===currentWeapon){x.fillRect(15,wy-11,16,16);x.fillStyle='#000';}

  // прицел
  x.strokeStyle='#ff8020';x.lineWidth=2;

  x.beginPath();
  x.moveTo(mouse.x-18,mouse.y);x.lineTo(mouse.x-6,mouse.y);
  x.moveTo(mouse.x+6,mouse.y);x.lineTo(mouse.x+18,mouse.y);
  x.moveTo(mouse.x,mouse.y-18);x.lineTo(mouse.x,mouse.y-6);
  x.moveTo(mouse.x,mouse.y+6);x.lineTo(mouse.x,mouse.y+18);
  x.stroke();

  // мини-карта
  const mmX=c.width-180,mmY=10;

  x.strokeStyle='#d4601a';x.lineWidth=2;x.strokeRect(mmX,mmY,170,120);

    else if(e.type==='mancrab')col='#0af';

    x.fillRect(mmX+e.x*sx-1,mmY+e.y*sy-1,3,3);
  });

  x.fillRect(mmX+P.x*sx-2,mmY+P.y*sy-2,4,4);

  if(waveBannerTimer>0){

  // пасхалка
  if(wakeUpTimer>0){

  // вспышка урона
  if(damageFlash>0){

  // GAME OVER

    x.fillText('Нажми ESC → В меню',c.width/2,c.height/2+70);
    x.textAlign='left';
  }
}

  mx.fillStyle='#4cf';
  mx.beginPath();mx.ellipse(pX-4,pY-28,3,2,0,0,Math.PI*2);mx.fill();
  mx.beginPath();mx.ellipse(pX+4,pY-28,3,2,0,0,Math.PI*2);mx.fill();
  mx.shadowBlur=0;

  // выстрелы
  if(demoTime%40<20){
    mx.save();mx.translate(pX+16,pY-8);mx.rotate(-.3);
    mx.fillStyle='#1a1a1a';mx.fillRect(0,-4,24,8);
    mx.fillStyle='#d4601a';mx.beginPath();mx.arc(6,0,3,0,Math.PI*2);mx.fill();
    if(demoTime%40<5){
      mx.shadowColor='#ff8020';mx.shadowBlur=15;
      mx.fillStyle='#ffa040';mx.beginPath();mx.arc(28,0,8,0,Math.PI*2);mx.fill();
      mx.shadowBlur=0;
    }
    mx.restore();
  }

  // HUD-подпись
  mx.fillStyle='rgba(30,30,40,.6)';
  mx.fillRect(w-120,10,110,50);
  mx.strokeStyle='#d4601a';mx.lineWidth=2;mx.strokeRect(w-120,10,110,50);
  mx.fillStyle='#d4601a';mx.font='bold 12px monospace';mx.textAlign='left';
  mx.fillText('DEMO',w-108,28);
  mx.fillStyle='#4cf';mx.font='bold 10px monospace';
  mx.fillText('Overwatch live',w-108,44);
}

function drawDemoCrab(ctx,cx,cy,s,col){
  ctx.fillStyle=col;
  ctx.beginPath();ctx.ellipse(cx,cy,18*s,12*s,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#b8a080';
  ctx.beginPath();ctx.ellipse(cx-5*s,cy-3*s,5*s,4*s,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#c89898';
  ctx.beginPath();ctx.ellipse(cx,cy+7*s,10*s,3*s,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#5a3a2a';
  ctx.beginPath();ctx.ellipse(cx,cy-5*s,8*s,3*s,0,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#6a3a2a';ctx.lineWidth=3*s;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(cx-10*s,cy+3*s);ctx.lineTo(cx-18*s,cy+12*s);ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx+10*s,cy+3*s);ctx.lineTo(cx+18*s,cy+12*s);ctx.stroke();
}

/* ============ ЗАПУСК ============ */
resizeMenu();
P.x=c.width/2;P.y=c.height-40-P.h;

function loop(){
  if(state==='game'){update();draw();}
  else if(state==='pause'){draw();}
  else if(state==='menu'){drawMenuDemo();}
  else if(state==='credits'){drawMenuDemo();}
  requestAnimationFrame(loop);
}
loop();

</script>
